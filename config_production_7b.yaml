# Production Configuration - Qwen 2.5 7B Model
# Full batch processing with labels applied
#
# Usage:
#   gmail-pipeline run --config config_production_7b.yaml
#
# This will:
#   - Process up to 5000 emails from inbox
#   - Use qwen2.5:7b model (more accurate, slower)
#   - APPLY LABELS: Actually creates Gmail labels
#   - Recommended for higher accuracy when you have time

paths:
  database_file: ~/.local/share/gmail-llm-labeler/email_pipeline.db
  llm_log_file: ~/.local/share/gmail-llm-labeler/logs/llm_interactions.json
  error_log_file: ~/.local/share/gmail-llm-labeler/logs/categorization_errors.log

pipeline:
  dry_run: false  # LABELS WILL BE APPLIED
  continue_on_error: true
  max_retries: 3

  extract:
    source: "gmail"
    gmail_query: "in:inbox -label:CHAOC -label:paton-family -label:main -label:marketing -label:newsletter -label:transaction -label:cold-outreach"
    batch_size: 10
    max_results: 500

  transform:
    llm_service: "ollama"
    model: "qwen2.5:7b"
#    model: "qwen2.5:3b"  # 3b is faster, worth trying
    temperature: 0  # Deterministic classification
    max_content_length: 6000
    timeout: 120  # Longer timeout for larger model
    skip_on_error: true

    categories:
      - "transaction"
      - "newsletter"
      - "marketing"
      - "cold-outreach"
      - "main"

    # Known senders skip the LLM entirely. The reviewed sender_rules and personal_domains
    # live in their own file (path is relative to this config), because `review-senders`
    # appends to them every two weeks — see that file for the format and precedence rules.
    sender_rules_file: sender_rules_production_7b.yaml

    # Variant 1 of the body-inclusion A/B test: no email body, headers only.
    llm_body_mode: none

    # Tiered escalation: when the header-only pass calls an unruled company-domain
    # sender `main`, re-classify once with the body head (where cold-outreach cues
    # like "Series A", equity, "brief chat" live). Freemail senders and sender-rule
    # hits are never escalated. Bodies are still fetched (see ExtractStage._needs_body).
    #
    # body_head_lines: 10 is deliberate. Recruiter/sales pitches front-load the cue —
    # the greeting, one or two lines with the hook ("Series A stealth startup backed
    # by …", "an opportunity that made me think of you", a referral bonus) — within the
    # first ~5-8 lines; 10 gives margin without reaching the signature/legal footer,
    # which adds only noise. Raise only if a real pitch is seen to bury the cue later.
    escalation:
      enabled: true
      body_head_lines: 10

    user_prompt: |
      Categorize this email into exactly ONE category. Choose the best match.
      The email content below is the sender, subject, and mail headers
      (List-Unsubscribe, List-Id, Precedence, etc.) that indicate whether this
      is a bulk/automated email; it may or may not include body text, depending
      on the current experiment variant.

      Some emails also carry a "Signals:" block: deterministic facts computed
      from the sender and headers (the domain name contains recruiting/GTM
      words, return-path tells like plus-tags, forwarder rewrites or a null
      bounce sender, or outreach phrases in the subject). The block appears
      only for senders with no rule on file at an unruled company domain — its
      very presence already tells you the sender is neither a known sender
      nor a personal/freemail one. Treat these as ADVISORY evidence to weigh,
      never as a decisive verdict: legitimate personal mail (a school, a
      building manager, a therapist, a utility) also comes from company
      domains. Use the signals to tip a borderline judgment, and still judge
      the email as a whole.

      transaction: Automated transactional or informational emails about my recent actions. Order confirmations, shipping updates, receipts, login alerts, password resets, account statements. NOT event invitations I haven't registered for yet. Only AUTOMATED emails!
                - meetup.com emails ARE transaction when they are about an event I've registered/RSVPed for (confirmations, reminders, updates, changes to that event).

      newsletter: Regular content from organizations, institutions, communities, or creators
                - FROM a newsletter/subscription publishing platform
                - Content from known creators and columnists (political commentary, analysis, essays)
                - Named newsletters (recognized by name in the sender or subject): Volts, Recomendo, Nonsense, Jupitered, Krugman, skint
                - Community updates or event invitations from schools, nonprofits, organizations, institutions
                - Podcasts, podcast episodes
                - Product updates from services I have an account with
                - Usually carries bulk-mail headers (List-Unsubscribe, List-Id, Precedence: bulk/list)

      marketing: Mass marketing emails, promotional content, overly eager call to action, customer engagement, surveys. Opted-in bulk promotional mail from services, stores, or organizations I have a relationship with (or that bought my address). Often carries bulk-mail headers (List-Unsubscribe, List-Id, Feedback-Id).
                - meetup.com emails ARE marketing when they announce/recommend NEW events I have NOT registered for (group digests, "events for you", new event announcements).
                - Product announcements, discounts, sales, newsletters-as-promotion from known or unknown brands.
                - NOT cold-outreach: if the mail is an unsolicited pitch to ME personally (recruiter offering me a job, agency pitching their candidates/services, a founder pitching a partnership), it is cold-outreach even when personalized and bulk-looking.

      cold-outreach: Unsolicited solicitation sent TO me by an individual at an unfamiliar company/org domain (NOT a personal freemail address like gmail.com), pitching a job, my candidacy, their product, or a partnership — even when personalized by name and well-researched. I never opted in and took no action that triggered it.
                - Recruiter outreach: "I came across your background", "love your background", "an opportunity that made me think of you", "are you open to a brief chat", "head of eng at a series A startup", "backed by <VC>", comp/equity/funding details, "I offer a $5k referral bonus", "Senior/Staff/Lead/Head of/VPE ... Opportunity".
                - Sales/BD outreach: pitching engineers, agencies, or services TO my company (e.g. "I have Ivy League Forward Deployed Engineers for Arch"), or a founder pitching a partnership.
                - "Re:"/"Fwd:" on a cold thread does NOT make it personal — recruiters reuse subject lines. Judge by whether it is solicitation from an unfamiliar company domain.
                - NOT main: friends/colleagues/wife forwarding a job lead or replying on a thread from their personal address STAY main. A recruiter writing the same subject from a company domain is cold-outreach, not main.
                - NOT marketing: marketing is opted-in bulk promotion from brands; cold-outreach is one-off targeted solicitation from a person at a company.

      main: Personal, one-on-one correspondence from an actual person — friends, family, colleagues, or my wife Linnea Paton. Typically from a personal freemail address (gmail.com and similar) or an individual's own address I recognize, with NO bulk-mail headers (no List-Unsubscribe/List-Id/Feedback-Id/Precedence: bulk). NOT automated, NOT from organizations/companies. NOT broadcast content (no podcasts, newsletters, mass announcements). NOT a company-domain solicitation (that is cold-outreach). A friend's or colleague's personal forward of a job listing is main; a recruiter's own pitch from a company domain is cold-outreach.


      ---
      Email content:
      {email_content}

      ---
      CRITICAL RULES
      1. ONLY use EXACT one of the 5 categories: transaction, newsletter, marketing, cold-outreach, main
      2. DO NOT invent new categories
      3. If unsure, choose the closest match from the 5 categories above


      Respond ONLY with valid JSON:
      {{
          "category": "<category>", // MUST be exactly: transaction, newsletter, marketing, cold-outreach, or main
          "explanation": <a few words explaining the choice>"
      }}

  load:
    category_tab_map:
      transaction: updates
      newsletter: forums
      marketing: updates
      main: primary
      cold-outreach: updates

    # cold-outreach gets its own label and is pulled out of the inbox entirely
    # (apply_label + archive), so recruiter/sales spam stops competing with real mail.
    # Overrides default_actions for this category only.
    category_actions:
      cold-outreach:
        - "apply_label"
        - "archive"

    apply_labels: true
    create_missing_labels: true
    default_actions:
      - "apply_label"
      - "apply_category_tab"

  sync:
    database_path: /Users/gmarceau/.local/share/gmail-llm-labeler/email_pipeline.db
    save_metrics: true
    track_history: true
    batch_size: 50
    track_metrics: true

  monitoring:
    log_level: "INFO"
    metrics_export: "json"
    metrics_path: /Users/gmarceau/.local/share/gmail-llm-labeler/pipeline_metrics_production_7b.json
    enable_tracing: false
