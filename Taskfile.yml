version: "3"

vars:
  CONFIG: config_production_7b.yaml

tasks:
  test:
    desc: Run the test suite (pass CLI_ARGS to target specific tests, e.g. task test CLI_ARGS=tests/test_foo.py)
    cmds:
      - venv/bin/python -m pytest {{.CLI_ARGS}}

  validate-config:
    desc: Validate a pipeline config file (pass CONFIG to target a different file, e.g. task validate-config CONFIG=my_config.yaml)
    cmds:
      - venv/bin/python -m email_labeler.pipeline.cli validate-config {{.CONFIG}}

  review-senders:
    desc: >
      List senders not yet covered by sender_rules, as pasteable rule candidates ranked by
      count with header/subject samples, so you can decide a category and add them to
      CONFIG's sender_rules. Run every two weeks. Pass CONFIG to target a different file.
    cmds:
      - venv/bin/python -m email_labeler.pipeline.cli review-senders --config {{.CONFIG}}
